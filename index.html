<script>
// --- UPGRADED EM7 AI - REAL CHATGPT LIKE ENGINE ---
async function toggleAI(){ let b=document.getElementById('aiBox'); b.style.display=b.style.display==='flex'?'none':'flex'; }

async function sendAI(){
  let inp = document.getElementById('aiInput');
  let txt = inp.value.trim();
  if(!txt) return;
  let box = document.getElementById('aiMsgs');
  
  // User ka message dikhao
  box.innerHTML += `<div class="msg user">${txt}</div>`;
  inp.value = '';
  box.scrollTop = box.scrollHeight;

  // Typing dikhao
  box.innerHTML += `<div class="msg bot" id="typing">EM7 AI soch raha hai... <i class="fa-solid fa-spinner fa-spin"></i></div>`;
  box.scrollTop = box.scrollHeight;

  try{
    // Real AI API call - ye mere jaisa jawab dega
    let systemPrompt = `You are EM7 AI GURU. You are a Cybersecurity Expert from Lucknow, India. Your name is Aman, brand EM7 HOON. Contact 6394806370, Insta @em7_aman. You answer in Hinglish (Hindi + English mix) friendly style like a pro hacker friend. You help with hacking, security, coding, life, anything. Keep answers short (2-3 lines) for mobile.`;
    
    let response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(txt)}?system=${encodeURIComponent(systemPrompt)}`);
    let aiReply = await response.text();

    // Typing hatao aur real jawab dikhao
    document.getElementById('typing').remove();
    
    // Agar reply bahut lamba hai to chota karo
    if(aiReply.length > 600) aiReply = aiReply.substring(0, 600) + "...";

    box.innerHTML += `<div class="msg bot">${aiReply}<br><br><span style="font-size:10px;opacity:0.5">📞 6394806370 | @em7_aman</span></div>`;
    box.scrollTop = box.scrollHeight;

  }catch(err){
    document.getElementById('typing')?.remove();
    box.innerHTML += `<div class="msg bot">Net slow hai Chele, ek baar fir se pucho. Ya direct WhatsApp karo 6394806370 pe.<br>Error: ${err.message}</div>`;
    box.scrollTop = box.scrollHeight;
  }
}

// Enter se bhi bheje
document.getElementById('aiInput')?.addEventListener('keypress', function(e){
  if(e.key === 'Enter') sendAI();
});
</script>
