<!DOCTYPE html>
<html>
<head><title>EM7 Search</title></head>
<body style="background:white; color:black; font-family:Arial; padding:20px;">
<h1>EM7 Shoes Store - Search</h1>
<div id="result" style="font-size:20px; margin-top:20px; border:1px solid black; padding:10px;"></div>

<script>
let q = new URLSearchParams(window.location.search).get('q');
if(q){
  document.getElementById('result').innerHTML = "You searched for: " + q;
} else {
  document.getElementById('result').innerHTML = "Search karo ?q=shoes likh ke";
}
</script>
</body>
</html>
