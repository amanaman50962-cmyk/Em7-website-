<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberGuard PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;min-height:100vh;color:#fff;background:#070a14;overflow-x:hidden;
background:radial-gradient(1200px 600px at 10% 20%, rgba(0,255,163,0.18), transparent 60%),radial-gradient(1000px 500px at 90% 10%, rgba(123,97,255,0.30), transparent 60%),linear-gradient(180deg, #0b0e1f 0%, #0f1230 100%);}
.bg{position:fixed;inset:0;z-index:-1;filter:blur(60px);opacity:0.9}
.b{position:absolute;border-radius:50%;animation:f 18s infinite}
.b1{width:500px;height:500px;background:#00ff9d;top:-10%;left:-5%}
.b2{width:600px;height:600px;background:#7b61ff;top:5%;right:-10%;animation-delay:-5s}
@keyframes f{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,60px) scale(1.2)}}
.container{max-width:1100px;margin:20px auto;padding:0 15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.glass{background:linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06));backdrop-filter:blur(32px) saturate(180%);border:1px solid rgba(255,255,255,0.18);border-top:1px solid rgba(255,255,255,0.38);border-radius:22px;padding:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.5),0 20px 60px rgba(0,0,0,0.45)}
input{flex:1;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:11px;color:#fff;outline:none;width:100%}
.btn{background:linear-gradient(135deg,#00ff9d,#00d4ff);color:#000;font-weight:700;border:none;border-radius:12px;padding:11px 16px;cursor:pointer;margin-top:10px;width:100%}
.result{margin-top:10px;padding:10px;border-radius:12px;background:rgba(0,0,0,0.35);font-family:monospace;font-size:0.85rem;white-space:pre-wrap;min-height:40px}
</style></head>
<body>
<div class="bg"><div class="b b1"></div><div class="b b2"></div></div>
<div style="text-align:center;padding:25px"><h1 style="font-size:2rem">🛡️ CyberGuard <span style="color:#00ff9d">PRO</span></h1><p style="opacity:0.7">All Tools Working + Liquid Glass Design</p></div>
<div class="container">
<div class="glass"><h3>📍 Get My Location</h3><button class="btn" onclick="getGPS()">Get My Location</button><div id="gpsRes" class="result"></div></div>
<div class="glass"><h3>🌐 Track My IP</h3><button class="btn" onclick="trackIP()">Track My IP</button><div id="ipRes" class="result"></div></div>
<div class="glass"><h3>📧 Email Checker</h3><input id="emailIn" placeholder="aman@example.com"><button class="btn" onclick="checkEmail()">Check Email</button><div id="emailRes" class="result"></div></div>
<div class="glass"><h3>🔒 Password Strength</h3><input id="passIn" placeholder="Type password" oninput="checkPass()"><div id="passRes" class="result"></div></div>
<div class="glass"><h3>🔗 URL Shortener Check</h3><input id="urlIn" placeholder="https://example.com"><button class="btn" onclick="checkURL()">Check URL</button><div id="urlRes" class="result"></div></div>
<div class="glass"><h3>📱 QR Generator</h3><input id="qrIn" placeholder="Text or Link"><button class="btn" onclick="genQR()">Make QR</button><div id="qrRes" class="result"></div></div>
<div class="glass"><h3>💬 WhatsApp Direct</h3><input id="waIn" placeholder="916394806370"><button class="btn" onclick="openWA()">Open Chat</button></div>
<div class="glass"><h3>🛡️ IP Info Lookup</h3><input id="ipIn" placeholder="8.8.8.8"><button class="btn" onclick="lookupIP()">Lookup</button><div id="ipLookRes" class="result"></div></div>
</div>
<div style="text-align:center;padding:20px;opacity:0.6">EM7 GURU PRO | All Working</div>
<script>
function show(id,t){document.getElementById(id).textContent=t}
function getGPS(){show('gpsRes','Loading...');navigator.geolocation.getCurrentPosition(p=>{show('gpsRes',`Lat: ${p.coords.latitude}\nLng: ${p.coords.longitude}\nMap: https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`)},e=>show('gpsRes','Error: '+e.message))}
async function trackIP(){show('ipRes','Loading...');let r=await fetch('https://ipapi.co/json/');let j=await r.json();show('ipRes',`IP: ${j.ip}\nCity: ${j.city}\nCountry: ${j.country_name}\nOrg: ${j.org}`)}
function checkEmail(){let e=document.getElementById('emailIn').value;let v=/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(e);show('emailRes',`Email: ${e}\nValid: ${v?'Yes ✅':'No ❌'}`)}
function checkPass(){let p=document.getElementById('passIn').value;let s='Weak';if(p.length>8)s='Medium';if(p.length>12&&/[A-Z]/.test(p)&&/[0-9]/.test(p)&&/[^A-Za-z0-9]/.test(p))s='Strong ✅';show('passRes',`Length: ${p.length}\nStrength: ${s}`)}
function checkURL(){let u=document.getElementById('urlIn').value;show('urlRes',`URL: ${u}\nHost: ${(() => {try{return new URL(u).host}catch{return 'Invalid'}})()}`)}
function genQR(){let t=document.getElementById('qrIn').value;if(!t){show('qrRes','Kuch likho');return}show('qrRes',`QR API: https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(t)}\n\nOpen link to see QR`)}
function openWA(){let n=document.getElementById('waIn').value;window.open(`https://wa.me/${n}`,'_blank')}
async function lookupIP(){let ip=document.getElementById('ipIn').value;if(!ip){show('ipLookRes','IP daalo');return}show('ipLookRes','Loading...');try{let r=await fetch(`https://ipwho.is/${ip}`);let j=await r.json();show('ipLookRes',`IP: ${j.ip}\nCity: ${j.city}\nCountry: ${j.country}\nISP: ${j.connection?j.connection.isp:j.org}`)}catch(e){show('ipLookRes','Error')}}
</script>
</body></html>
