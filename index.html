<!-- EM7 GURU 2.0 PERFECT -->
<style>
#guruBtn{position:fixed;bottom:20px;right:20px;width:62px;height:62px;background:linear-gradient(135deg,#00ff88,#00cc6a);border-radius:50%;border:none;font-size:26px;z-index:9999;box-shadow:0 4px 20px rgba(0,255,136,0.4)}
#guruBox{position:fixed;bottom:90px;right:12px;left:12px;max-width:420px;margin:auto;height:75vh;max-height:520px;background:#0e141f;border:1px solid #00ff88;border-radius:20px;display:none;flex-direction:column;z-index:9999;overflow:hidden}
</style>
<button id="guruBtn" onclick="openGuru()">🤖</button>
<div id="guruBox">
<div style="background:#00ff88;color:#000;padding:12px 16px;font-weight:800;display:flex;justify-content:space-between">EM7 GURU 2.0 - LIVE AI <span onclick="openGuru()" style="cursor:pointer">✕</span></div>
<div id="guruChat" style="flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#070a0f"></div>
<div style="display:flex;padding:10px;gap:8px;background:#0e141f;border-top:1px solid #1a2332">
<button onclick="startVoice()" style="background:#1a2332;border:none;color:#fff;width:44px;border-radius:50%">🎤</button>
<input id="guruInput" placeholder="Kuch bhi pucho..." style="flex:1;padding:12px;border-radius:22px;border:1px solid #1a2332;background:#070a0f;color:#fff">
<button onclick="sendGuru()" style="background:#00ff88;border:none;width:44px;border-radius:50%">➤</button>
</div>
</div>
<script>
let guruOpen=false;
function openGuru(){let b=document.getElementById('guruBox');guruOpen=!guruOpen;b.style.display=guruOpen?'flex':'none';if(guruOpen&&!localStorage.getItem('guru_welcome')){addMsg('bot','Hi Chele! Mai EM7 GURU 2.0 hu 🚀<br>Ab mai:<br>• Voice sun sakta hu<br>• History yaad rakhunga<br>• Photo scan kar sakta hu<br>Bolo kya help chahiye?');localStorage.setItem('guru_welcome','1')}}
function addMsg(who,html){let c=document.getElementById('guruChat');let d=document.createElement('div');d.style.cssText=`padding:10px 12px;border-radius:14px;max-width:85%;font-size:13px;line-height:1.5;${who==='user'?'background:#00ff88;color:#000;margin-left:auto':'background:#1a2332;color:#fff'}`;d.innerHTML=html;c.appendChild(d);c.scrollTop=c.scrollHeight;let h=JSON.parse(localStorage.getItem('guru_history')||'[]');h.push({who,html});localStorage.setItem('guru_history',JSON.stringify(h.slice(-30)))}
async function sendGuru(){let i=document.getElementById('guruInput'),t=i.value.trim();if(!t)return;addMsg('user',t);i.value='';addMsg('bot','<i>Soch raha hu... ⚡</i>');try{let r=await fetch(`https://text.pollinations.ai/${encodeURIComponent(t)}?system=${encodeURIComponent('You are EM7 GURU 2.0, Aman from Lucknow, cyber expert, EM7 HOON founder. Contact 6394806370, insta @em7_aman. Answer in Hinglish, short, helpful, like pro hacker but friendly. Always give practical solution.')}`);let txt=await r.text();document.getElementById('guruChat').lastChild.remove();addMsg('bot',txt.substring(0,800).replace(/\n/g,'<br>'));speech(txt.substring(0,200))}catch{document.getElementById('guruChat').lastChild.remove();addMsg('bot','Net slow hai, fir se bolo Chele! Ya WhatsApp karo 6394806370')}}
function speech(t){if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';u.rate=1.1;speechSynthesis.speak(u)}}
function startVoice(){let rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();rec.lang='hi-IN';rec.start();rec.onresult=e=>{document.getElementById('guruInput').value=e.results[0][0].transcript;sendGuru()}}
document.getElementById('guruInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendGuru()});
// Load history
(function(){let h=JSON.parse(localStorage.getItem('guru_history')||'[]');h.forEach(m=>addMsg(m.who,m.html))})();
  </script>
