<!DOCTYPE html>
<html>
<head>
<title>EM7 HACK LAB V2 - Locked</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#000;color:#0f0;font-family:monospace;text-align:center;padding:20px}
.box{border:2px solid #0f0;padding:20px;max-width:400px;margin:30px auto;border-radius:10px}
input{padding:10px;width:80%;background:#111;color:#0f0;border:1px solid #0f0;margin:10px}
button{padding:10px 20px;background:#0f0;color:#000;border:none;font-weight:bold;cursor:pointer}
#lab{display:none}
.test{border:1px solid #0f0;margin:15px;padding:15px;text-align:left}
</style>
</head>
<body>

<div id="lock" class="box">
<h2>🔒 EM7 HACK LAB V2</h2>
<p>Enter Lab Password:</p>
<input type="password" id="pass" placeholder="Password dalo">
<br>
<button onclick="unlock()">UNLOCK</button>
<p id="msg"></p>
<p style="font-size:12px;color:gray">Hint: EM7@2026</p>
</div>

<div id="lab">
<h1>💀 EM7 HACK LAB V2 - UNLOCKED 💀</h1>

<div class="test">
<h3>1. XSS Tester</h3>
<input id="xss" placeholder="<script>alert(1)</script>">
<button onclick="runXSS()">TEST</button>
<div id="out1"></div>
</div>

<div class="test">
<h3>2. SQLi Login Bypass Tester</h3>
<input id="sqli" placeholder="Try: ' OR '1'='1">
<button onclick="runSQL()">TEST</button>
<div id="out2"></div>
</div>

<p style="color:gray">For Educational Purpose Only</p>
</div>

<script>
function unlock(){
  let p = document.getElementById('pass').value;
  if(p === "EM7@2026"){
    document.getElementById('lock').style.display='none';
    document.getElementById('lab').style.display='block';
  } else {
    document.getElementById('msg').innerHTML="❌ Wrong Password!";
  }
}
function runXSS(){
  let code = document.getElementById('xss').value;
  document.getElementById('out1').innerHTML = "Output: " + code;
}
function runSQL(){
  let code = document.getElementById('sqli').value;
  if(code.includes("OR")){
    document.getElementById('out2').innerHTML="✅ Bypass Success (Demo Lab)";
  } else {
    document.getElementById('out2').innerHTML="❌ Try Again";
  }
}
</script>
</body>
</html>
